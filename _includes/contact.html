<ul class="contact-links" aria-label="Contact and profiles">
  {% if site.author.email %}<li><a href="mailto:{{ site.author.email }}"><span aria-hidden="true">✉</span> Email</a></li>{% endif %}
  {% if site.author.github %}<li><a href="{{ site.author.github }}">GitHub</a></li>{% endif %}
  {% if site.author.scholar %}<li><a href="{{ site.author.scholar }}">Google Scholar</a></li>{% endif %}
  {% if site.author.linkedin %}<li><a href="{{ site.author.linkedin }}">LinkedIn</a></li>{% endif %}
</ul>
