<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url != '/' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=20261010-4">
  <link rel="icon" href="data:,">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include navigation.html %}
  <main id="main" class="container page {{ page.page_class }}">
    {% if page.page_class == 'about' %}{% include about-header.html %}{% endif %}
    {% unless page.hide_title %}<h1>{{ page.title | escape }}</h1>{% endunless %}
    {{ content }}
  </main>
</body>
</html>
